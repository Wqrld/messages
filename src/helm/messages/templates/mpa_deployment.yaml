{{- if .Values.mpa.enabled -}}
{{- $envVars := include "messages.common.env" (list . .Values.mpa) -}}
{{- $fullName := include "messages.mpa.fullname" . -}}
{{- $component := "mpa" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    {{- with .Values.mpa.dpAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "messages.common.labels" (list . $component) | nindent 4 }}
spec:
  replicas: {{ .Values.mpa.replicas }}
  selector:
    matchLabels:
      {{- include "messages.common.selectorLabels" (list . $component) | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.mpa.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "messages.common.selectorLabels" (list . $component) | nindent 8 }}
    spec:
      {{- if $.Values.image.credentials }}
      imagePullSecrets:
        - name: {{ include "messages.secret.dockerconfigjson.name" (dict "fullname" (include "messages.fullname" .) "imageCredentials" $.Values.image.credentials) }}
      {{- end}}
      {{- if .Values.mpa.serviceAccountName }}
      serviceAccountName: {{ .Values.mpa.serviceAccountName }}
      {{- end }}
      shareProcessNamespace: {{ .Values.mpa.shareProcessNamespace }}
      containers:
        {{- with .Values.mpa.sidecars }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: {{ .Chart.Name }}
          image: "{{ (.Values.mpa.image | default dict).repository | default .Values.image.repository }}:{{ (.Values.mpa.image | default dict).tag | default .Values.image.tag }}"
          imagePullPolicy: {{ (.Values.mpa.image | default dict).pullPolicy | default .Values.image.pullPolicy }}
          {{- with .Values.mpa.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mpa.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $envVars}}
          env:
            {{- $envVars | indent 12 }}
          {{- end }}
          {{- if .Values.mpa.envFrom }}
          envFrom:
            {{- toYaml .Values.mpa.envFrom | nindent 12 }}
          {{- end }}
          {{- with .Values.mpa.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.mpa.service.targetPort }}
              protocol: TCP
          {{- if .Values.mpa.probes.liveness }}
          livenessProbe:
            {{- include "messages.probes.abstract" (merge .Values.mpa.probes.liveness (dict "targetPort" .Values.mpa.service.targetPort )) | nindent 12 }}
          {{- end }}
          {{- if .Values.mpa.probes.readiness }}
          readinessProbe:
            {{- include "messages.probes.abstract" (merge .Values.mpa.probes.readiness (dict "targetPort" .Values.mpa.service.targetPort )) | nindent 12 }}
          {{- end }}
          {{- if .Values.mpa.probes.startup }}
          startupProbe:
            {{- include "messages.probes.abstract" (merge .Values.mpa.probes.startup (dict "targetPort" .Values.mpa.service.targetPort )) | nindent 12 }}
          {{- end }}
          {{- with .Values.mpa.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- range $index, $value := .Values.mountFiles }}
            - name: "files-{{ $index }}"
              mountPath: {{ $value.path }}
              subPath: content
            {{- end }}
            {{- range $name, $volume := .Values.mpa.persistence }}
            - name: "{{ $name }}"
              mountPath: "{{ $volume.mountPath }}"
            {{- end }}
            {{- range .Values.mpa.extraVolumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              subPath: {{ .subPath | default "" }}
              readOnly: {{ .readOnly }}
            {{- end }}
      {{- with .Values.mpa.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mpa.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mpa.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- range $index, $value := .Values.mountFiles }}
        - name: "files-{{ $index }}"
          configMap:
            name: "{{ include "messages.fullname" $ }}-files-{{ $index }}"
        {{- end }}
        {{- range $name, $volume := .Values.mpa.persistence }}
        - name: "{{ $name }}"
          {{- if eq $volume.type "emptyDir" }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: "{{ $fullName }}-{{ $name }}"
          {{- end }}
        {{- end }}
        {{- range .Values.mpa.extraVolumes }}
        - name: {{ .name }}
          {{- if .existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .existingClaim }}
          {{- else if .secret }}
          secret:
            {{ toYaml .secret | nindent 12 }}
          {{- else if .hostPath }}
          hostPath:
            {{ toYaml .hostPath | nindent 12 }}
          {{- else if .csi }}
          csi:
            {{- toYaml .csi | nindent 12 }}
          {{- else if .configMap }}
          configMap:
            {{- toYaml .configMap | nindent 12 }}
          {{- else if .emptyDir }}
          emptyDir:
            {{- toYaml .emptyDir | nindent 12 }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
---
{{ if .Values.mpa.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "messages.common.selectorLabels" (list . $component) | nindent 6 }}
{{ end }}
{{- end }}
