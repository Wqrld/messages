## @section mtaIn

mtaIn:
  ## @param mtaIn.enabled Whether to deploy the inbound MTA (SMTP on port 25)
  enabled: false

  ## @param mtaIn.image.repository Repository to use to pull messages's mtaIn container image
  ## @param mtaIn.image.tag messages's mtaIn container tag
  ## @param mtaIn.image.pullPolicy mtaIn container image pull policy
  image:
    repository: ghcr.io/suitenumerique/messages-mta-in-py
    pullPolicy: IfNotPresent
    tag: "latest"

  ## @param mtaIn.command Override the mtaIn container command
  command: []

  ## @param mtaIn.args Override the mtaIn container args
  args: []

  ## @param mtaIn.replicas Amount of mtaIn replicas
  replicas: 1

  ## @param mtaIn.shareProcessNamespace Enable share process namespace between containers
  shareProcessNamespace: false

  ## @param mtaIn.sidecars Add sidecars containers to mtaIn deployment
  sidecars: []

  ## @param mtaIn.securityContext.allowPrivilegeEscalation Whether to allow privilege escalation for the mtaIn container
  ## @param mtaIn.securityContext.capabilities.drop List of capabilities to drop for the mtaIn container
  ## @param mtaIn.securityContext.runAsNonRoot Whether to run the mtaIn container as a non-root user
  ## @param mtaIn.securityContext.seccompProfile.type Seccomp profile type for the mtaIn container
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - "ALL"
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## @param mtaIn.envVars Configure mtaIn container environment variables
  ## @extra mtaIn.envVars.BY_VALUE Example environment variable by setting value directly
  ## @extra mtaIn.envVars.FROM_CONFIGMAP.configMapKeyRef.name Name of a ConfigMap when configuring env vars from a ConfigMap
  ## @extra mtaIn.envVars.FROM_CONFIGMAP.configMapKeyRef.key Key within a ConfigMap when configuring env vars from a ConfigMap
  ## @extra mtaIn.envVars.FROM_SECRET.secretKeyRef.name Name of a Secret when configuring env vars from a Secret
  ## @extra mtaIn.envVars.FROM_SECRET.secretKeyRef.key Key within a Secret when configuring env vars from a Secret
  ## @skip mtaIn.envVars
  envVars:
    <<: *commonEnvVars
    # Unprivileged: the container runs as non-root with every capability dropped, so it
    # cannot bind 25 unless the runtime lowers ip_unprivileged_port_start. The Service
    # still listens on 25.
    PYMTA_SMTP_BIND_PORT: "2525"

  ## @skip mtaIn.envFrom List of environment variables taken from Secrets or configMaps
  envFrom: []
  # envFrom:
  #   - secret:
  #       name: super-secret-user-credentials
  #   - configMapRef:
  #       name: my-environment-variables

  ## @param mtaIn.podAnnotations Annotations to add to the mtaIn Pod
  podAnnotations: {}

  ## @param mtaIn.dpAnnotations Annotations to add to the mtaIn Deployment
  dpAnnotations: {}

  ## @param mtaIn.service.type mtaIn Service type
  ## @param mtaIn.service.port mtaIn Service listening port
  ## @param mtaIn.service.targetPort mtaIn container listening port
  ## @param mtaIn.service.annotations Annotations to add to the mtaIn Service
  service:
    type: ClusterIP
    port: 25
    targetPort: 2525
    annotations: {}

  ## @param mtaIn.probes.liveness.tcpSocket.port Port for the mtaIn TCP liveness probe
  ## @param mtaIn.probes.readiness.tcpSocket.port Port for the mtaIn TCP readiness probe
  probes:
    liveness:
      tcpSocket:
        port: 2525
    readiness:
      tcpSocket:
        port: 2525

  ## @param mtaIn.resources Resource requirements for the mtaIn container
  resources: {}

  ## @param mtaIn.nodeSelector Node selector for the mtaIn Pod
  nodeSelector: {}

  ## @param mtaIn.tolerations Tolerations for the mtaIn Pod
  tolerations: []

  ## @param mtaIn.affinity Affinity for the mtaIn Pod
  affinity: {}

  ## @param mtaIn.persistence Additional volumes to create and mount on the mtaIn. Used for debugging purposes
  ## @extra mtaIn.persistence.volume-name.size Size of the additional volume
  ## @extra mtaIn.persistence.volume-name.type Type of the additional volume, persistentVolumeClaim or emptyDir
  ## @extra mtaIn.persistence.volume-name.mountPath Path where the volume should be mounted to
  persistence: {}

  ## @param mtaIn.extraVolumeMounts Additional volumes to mount on the mtaIn.
  extraVolumeMounts: []

  ## @param mtaIn.extraVolumes Additional volumes to mount on the mtaIn.
  extraVolumes: []

  ## @param mtaIn.pdb.enabled Enable pdb on mtaIn
  pdb:
    enabled: true

  ## @param mtaIn.serviceAccountName Optional service account name to use for mtaIn pods
  serviceAccountName: null

