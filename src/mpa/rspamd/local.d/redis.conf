# One Redis for every module that keeps state (Bayes, fuzzy, ratelimit, DMARC reports,
# reputation). RSPAMD_redis_* in the environment, or RSPAMD_redis_url split by start.sh,
# which also defaults the servers to the compose service.
servers = "{= env.redis_servers =}";
{% if env.redis_username %}username = "{= env.redis_username =}";{% endif %}
{% if env.redis_password %}password = "{= env.redis_password =}";{% endif %}
{% if env.redis_db %}db = "{= env.redis_db =}";{% endif %}
